name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Statinė svetainė, build žingsnio nėra. Publikuojami tik svetainės failai
      # (README, CONTENT.md, scripts/ ir .github/ į viešą svetainę nepatenka).
      - name: Prepare site folder
        run: |
          set -e
          test -f index.html
          mkdir _site
          cp index.html _site/
          cp -r assets _site/assets
          cp robots.txt _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
